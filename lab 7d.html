<title>Bhuvana’s Math Object Example </title>
<script>
function Random(){
var num=Math.random(); document.getElementById("mathDemo").innerHTML="Random Number: "+num;
}
function SquareRoot(){ num=document.getElementById("TextBox1").value; var SquareRoot=Math.sqrt(num);
document.getElementById("mathDemo").innerHTML="Square Root of " +num + " is "
+SquareRoot;
}
</script>

<input type="text" id="TextBox1" placeholder="Enter a Number to find Squareroot">
