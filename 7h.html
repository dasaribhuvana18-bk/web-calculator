<title>User-defined Object Example</title>
<script>
function CollegeAward(college,award,year)
{ this.college=college; this.award=award; this.year=year;
}
CollegeAward.prototype.displayDetails=function(){ return this.college+" "+this.award+"("+this.year+")";
}
function createCollegeAward(){
var Award1=new CollegeAward("<b> Shri Vishnu Engineering College for Women </b>
<br>","\"Award of Best Women Engineering College\"",2023); document.getElementById("Demo").innerHTML=Award1.displayDetails();
}
</script>
</head>
<body>
<h1>User-defineed Object Example</h1>
<button onclick="createCollegeAward()">Create College Award</button>
<p id="Demo"></p>
</body>
