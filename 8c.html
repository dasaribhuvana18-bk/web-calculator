<title>To print 1 to 10 Numbers</title>
<script>
function printNumbers()
{ let result="";
result +="<strong>For loop:</strong>"; for (let i=1;i<=10;i++){
result +=i+" ";
}
result +="<br>";
result +="<strong>While loop:</strong>"; let j=1;
while(j<=10)
{	result
+=j+" "; j++;
}
result +="<br>";
result +="<strong>Do-While loop</strong>"; let k=1;
do{
result += k +" "; k+
+;
}while(k<=10); document.getElementById("loopResult").innerHTML=result;
}
</script>
</head>
<body>
<h1>Print Numbers Using Loops</h1>

<p id="loopResult"></p>
