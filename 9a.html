<html>
<head>
    
<title>JavaScript Functions Example</title>
<script>
function factorial(n){
    let fact = 1;
    for(let i=1;i<=n;i++){
        fact *= i;
    }
    return fact;
}
function fibonacci(n){
    let a=0,b=1,fib="0 1 ";
    for(let i=2;i<n;i++){
        let c=a+b;
        fib+=c+" ";
        a=b;
        b=c;
    }
    return fib;
}
function primes(n){
    let result="";
    for(let i=2;i<=n;i++){
        let isPrime=true;
        for(let j=2;j<=Math.sqrt(i);j++){
            if(i%j==0){
                isPrime=false;
                break;
            }
        }
        if(isPrime){
            result+=i+" ";
        }
    }
    return result;
}
function palindrome(n){
    let rev = n.toString().split("").reverse().join("");
    if(n==rev)
        return "Palindrome";
    else
        return "Not Palindrome";
}
function displayResults(){
    let num = parseInt(prompt("Enter a number"));
    document.getElementById("result").innerHTML =
    "Factorial: "+factorial(num)+"<br><br>"+
    "Fibonacci Series: "+fibonacci(num)+"<br><br>"+
    "Prime Numbers: "+primes(num)+"<br><br>"+
    "Palindrome Check: "+palindrome(num);
}
</script>
</head>
<body>
<h1>JavaScript Functions Example</h1>
<button onclick="displayResults()">Enter Number</button>
<p id="result"></p>
</body>
</html>
