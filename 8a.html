<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare Three Numbers</title>
<script>
function findLargest(){
let num1=parseInt(prompt("Enter the first number: ")); let num2=parseInt(prompt("Enter the second number:")); let num3=parseInt(prompt("Enter the third number:"));
if (num1==num2&&num2==num3){ document.getElementById("result").innerHTML="EQUALNUMBERS";
}else{
let largest=Math.max(num1,num2,num3); document.getElementById("result").innerHTML="LARGEST NUMBER: "+largest;
}
}
</script>
</head>
<body>
<h1>Compare Three Integers</h1>
<button onclick="findLargest()">Find Largest</button>
<p id="result"></p>
</body>
