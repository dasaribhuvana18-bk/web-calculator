<title>Pseudo-element Selector Example</title>
<style>
p::first-letter {
font-size: 30px; color: red;
font-weight: bold;
}
 p::first-line {
color: blue;
}
 h2::before {
content: " ";
}
 h2::after {
content: " ✔";
color: green;
}
</style>
</head>
<body>
<h1>Pseudo-element Selectors Demo</h1>
<h2>Welcome</h2>
<p>
This paragraph demonstrates pseudo-element selectors. The first letter and first line are styled differently
</p>
</body>

using pseudo-elements.
