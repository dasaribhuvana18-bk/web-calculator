<!DOCTYPE html>
<html>
<head>
  <title>Feedback Analyzer</title>
  <style>
    body { font-family: Arial; }
    table, th, td { border:1px solid #ccc; border-collapse:collapse; padding:5px; }
    .high { background:#c8f7c5; }
    .low { background:#f7c5c5; }
  </style>
</head>
<body>
<h3>Workshop Feedback</h3>
<input id="name" placeholder="Student Name">
<input id="topic" placeholder="Workshop Topic">
<input id="rating" type="number" min="1" max="5" placeholder="Rating (1-5)">
<input id="comment" placeholder="Comment">
<button onclick="add()">Submit</button>
<h4>Feedback List</h4>
<table>
  <thead>
    <tr><th>Name</th><th>Topic</th><th>Rating</th><th>Comment</th></tr>
  </thead>
  <tbody id="table"></tbody>
</table>
<h4>Analysis</h4>
<div id="analysis"></div>
<script>
let data = [];
function add() {
  let name = document.getElementById("name").value;
  let topic = document.getElementById("topic").value;
  let rating = +document.getElementById("rating").value;
  let comment = document.getElementById("comment").value;
  if (!name || !topic || rating<1 || rating>5) {
    alert("Enter valid data");
    return;
  }
  data.push({name, topic, rating, comment});
  display();
}
function display() {
  let table = document.getElementById("table");
  table.innerHTML = "";
  let sum = 0, max = 0;
  data.forEach(d => {
    sum += d.rating;
    if (d.rating > max) max = d.rating;
    let cls = d.rating >= 4 ? "high" : (d.rating <= 2 ? "low" : "");
    table.innerHTML += `
      <tr class="${cls}">
        <td>${d.name}</td>
        <td>${d.topic}</td>
        <td>${d.rating}</td>
        <td>${d.comment}</td>
      </tr>`;
  });
  let avg = data.length ? (sum/data.length).toFixed(2) : 0;
  document.getElementById("analysis").innerHTML = `
    Total Responses: ${data.length}<br>
    Average Rating: ${avg}<br>
    Highest Rating: ${max}
  `;
}
</script>
</body>
</html>
