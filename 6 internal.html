<!DOCTYPE html>
<html>
<head>
  <title>Expense Splitter</title>
</head>
<body>
<h3>Expense Splitter</h3>
<input id="name" placeholder="Expense name">
<input id="amount" type="number" placeholder="Amount">
<input id="payer" placeholder="Payer name">
<input id="people" type="number" placeholder="No. of people">
<button onclick="addExpense()">Add</button>
<h4>Expenses</h4>
<ul id="list"></ul>
<h4>Balances</h4>
<ul id="balance"></ul>
<script>
let expenses = [];
function addExpense() {
  let name = document.getElementById("name").value;
  let amount = +document.getElementById("amount").value;
  let payer = document.getElementById("payer").value;
  let people = +document.getElementById("people").value;

  expenses.push({ name, amount, payer, people });
  display();
}
function display() {
  let list = document.getElementById("list");
  let balance = document.getElementById("balance");
  list.innerHTML = "";
  let totals = {};
  expenses.forEach(e => {
    list.innerHTML += `<li>${e.name} - ₹${e.amount} by ${e.payer}</li>`;
    let share = e.amount / e.people;
    if (!totals[e.payer]) totals[e.payer] = 0;
    totals[e.payer] += e.amount;
    totals[e.payer] -= share;
  });
  balance.innerHTML = "";
  for (let person in totals) {
    balance.innerHTML += `<li>${person}: ₹${totals[person].toFixed(2)}</li>`;
  }
}
</script>
</body>
</html>
