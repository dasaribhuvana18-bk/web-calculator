<!DOCTYPE html>
<html>
<head>
  <title>Voting App</title>
</head>
<body>
<h3>Voting Eligibility</h3>
<input id="name" placeholder="Name">
<input id="age" type="number" placeholder="Age">
<input id="dept" placeholder="Department">
<button onclick="check()">Check</button>
<div id="voteSection" style="display:none;">
  <h4>Vote for Candidate</h4>
  <label><input type="radio" name="cand" value="A"> Candidate A</label><br>
  <label><input type="radio" name="cand" value="B"> Candidate B</label><br>
  <label><input type="radio" name="cand" value="C"> Candidate C</label><br><br>
  <button onclick="vote()">Submit Vote</button>
</div>
<h4>Results</h4>
<ul id="result"></ul>
<script>
let voted = false;
let votes = {A:0, B:0, C:0};
function check() {
  let age = document.getElementById("age").value;
  if (age >= 18) {
    alert("Eligible to vote");
    document.getElementById("voteSection").style.display = "block";
  } else {
    alert("Not eligible");
  }
}
function vote() {
  if (voted) {
    alert("You already voted!");
    return;
  }
  let selected = document.querySelector('input[name="cand"]:checked');
  if (!selected) {
    alert("Select a candidate");
    return;
  }
  votes[selected.value]++;
  voted = true;
  showResult();
}
function showResult() {
  let res = document.getElementById("result");
  res.innerHTML = "";
  let winner = "";
  let max = 0;
  for (let c in votes) {
    res.innerHTML += `<li>${c}: ${votes[c]} votes</li>`;
    if (votes[c] > max) {
      max = votes[c];
      winner = c;
    }
  }
  res.innerHTML += `<li><b>Winner: ${winner}</b></li>`;
}
</script>
</body>
</html>
