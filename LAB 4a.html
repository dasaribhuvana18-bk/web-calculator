<title>Simple Selector Example</title>
<style>
* {
font-family: Arial, sans-serif;
}
 p {
color: blue;
}
 #heading {
background-color: lightyellow; padding: 10px;
}
.box {
border: 2px solid green; padding: 10px;
margin: 10px;
}
 h1, h2 {
color: purple;
}
</style>
</head>
<body>
<h1 id="heading">Simple Selector Demo</h1>
<h2>Group Selector Example</h2>
<p>This paragraph is styled using element selector.</p>
<div class="box">
This div is styled using class selector.
</div>
<p class="box">
This paragraph uses class selector styling.
</p>
</body>
