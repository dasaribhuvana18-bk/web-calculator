<!DOCTYPE html>
<html>
<head>
  <title>Loan EMI Planner</title>
  <style>
    body { font-family: Arial; }
    .box { border:1px solid #ccc; padding:15px; margin-top:10px; width:250px; }
  </style>
</head>
<body>
<h3>Loan EMI Planner</h3>
<input id="amount" type="number" placeholder="Loan Amount"><br><br>
<input id="rate" type="number" placeholder="Interest Rate (%)"><br><br>
<input id="months" type="number" placeholder="Duration (Months)"><br><br>
<button onclick="calc()">Calculate</button>
<div class="box" id="result"></div>
<script>
function calc() {
  let P = +document.getElementById("amount").value;
  let R = +document.getElementById("rate").value / 12 / 100;
  let N = +document.getElementById("months").value;
  if (!P || !R || !N || P<=0 || R<=0 || N<=0) {
    alert("Enter valid values");
    return;
  }
  let EMI = (P * R * Math.pow(1+R, N)) / (Math.pow(1+R, N) - 1);
  let total = EMI * N;
  let interest = total - P;
  document.getElementById("result").innerHTML = `
    <b>Monthly EMI:</b> ₹${EMI.toFixed(2)}<br>
    <b>Total Interest:</b> ₹${interest.toFixed(2)}<br>
    <b>Total Payable:</b> ₹${total.toFixed(2)}
  `;
}
</script>
</body>
</html>
