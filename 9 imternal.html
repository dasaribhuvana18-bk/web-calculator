<!DOCTYPE html>
<html>
<head>
  <title>Image Gallery</title>
  <style>
    body { font-family: Arial; text-align:center; }
    .grid img { width:120px; margin:5px; cursor:pointer; }
    .preview {
      display:none; position:fixed; top:0; left:0;
      width:100%; height:100%; background:rgba(0,0,0,0.8);
    }
    .preview img { width:300px; margin-top:100px; }
  </style>
</head>
<body>
<h3>Image Gallery</h3>
<button onclick="filter('All')">All</button>
<button onclick="filter('Events')">Events</button>
<button onclick="filter('Nature')">Nature</button>
<button onclick="filter('Portraits')">Portraits</button>
<div class="grid" id="gallery"></div>
<div class="preview" id="preview">
  <button onclick="prev()">Prev</button>
  <img id="big">
  <button onclick="next()">Next</button><br>
  <button onclick="closePreview()">Close</button>
</div>
<script>
const images = [
  {src:"https://via.placeholder.com/300?text=Event1", cat:"Events"},
  {src:"https://via.placeholder.com/300?text=Nature1", cat:"Nature"},
  {src:"https://via.placeholder.com/300?text=Portrait1", cat:"Portraits"},
  {src:"https://via.placeholder.com/300?text=Event2", cat:"Events"},
  {src:"https://via.placeholder.com/300?text=Nature2", cat:"Nature"}
];
let current = 0, filtered = [...images];
function display() {
  let g = document.getElementById("gallery");
  g.innerHTML = "";
  filtered.forEach((img,i)=>{
    g.innerHTML += `<img src="${img.src}" onclick="openPreview(${i})">`;
  });
}
function filter(cat) {
  filtered = cat==="All" ? images : images.filter(i=>i.cat===cat);
  display();
}
function openPreview(i) {
  current = i;
  document.getElementById("preview").style.display="block";
  document.getElementById("big").src = filtered[current].src;
}
function next() {
  current = (current+1)%filtered.length;
  document.getElementById("big").src = filtered[current].src;
}
function prev() {
  current = (current-1+filtered.length)%filtered.length;
  document.getElementById("big").src = filtered[current].src;
}
function closePreview() {
  document.getElementById("preview").style.display="none";
}
display();
</script>
</body>
</html>
