<title> Bank Denomination</title>
<script>
function getDenomination(){
let amount =parseInt(prompt("Enter the amount lessthan 1000:")); let denominations=[100,500,20,10,5,2,1];
let result="";
for(let denom of denominations){
let count =Math.floor(amount/denom); if(count>0){
result +=count+"x"+denom+"'s<br>"; amount %=denom;
}
}
document.getElementById("denomResult").innerHTML=result;
}
</script>
</head>
<body>
<h1>Bank Denomination</h1>
<button onclick="getDenomination()">Get Denominations</button>
<p id="denomResult"></p>
</body>
